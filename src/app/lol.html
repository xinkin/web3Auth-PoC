⁠ <!DOCTYPE html>
<html>
  <head>
    <title>Send Funds on Mint Sepolia</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #1a1a1a;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        text-align: center;
        padding: 20px;
        background-color: #282828;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      }
      h1 {
        margin-top: 0;
      }
      input {
        margin-bottom: 10px;
        padding: 10px;
        width: 300px;
        border: none;
        border-radius: 5px;
        background-color: #333;
        color: #fff;
      }
      button {
        margin-top: 10px;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        background-color: #007bff;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Send Funds on Mint Sepolia</h1>

      <input
        type="text"
        id="toAddress"
        placeholder="Enter recipient address"
      /><br />

      <input
        type="number"
        id="amount"
        placeholder="Enter amount to send"
      /><br />

      <button onclick="sendFunds()">Send Funds</button>
    </div>

    <script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js"></script>
    <script>
      async function sendFunds() {
        const toAddress = document.getElementById('toAddress').value;
        const amount = document.getElementById('amount').value;

        if (typeof window.ethereum !== 'undefined') {
          try {
            await window.ethereum.request({ method: 'eth_requestAccounts' });
            const provider = new ethers.providers.Web3Provider(window.ethereum);
            const signer = provider.getSigner();

            const gasPrice = ethers.utils.parseUnits('30', 'gwei');
            const gasLimit = 100000;

            const tx = {
              to: toAddress,
              value: ethers.utils.parseEther(amount),
              gasPrice: gasPrice,
              gasLimit: gasLimit,
            };

            const transaction = await signer.sendTransaction(tx);
            console.log('Transaction sent:', transaction.hash);
            alert('Transaction sent successfully!');

            const receipt = await transaction.wait();
            console.log('Transaction mined:', receipt);
            alert('Transaction mined successfully!');
          } catch (error) {
            console.error('Error sending transaction:', error);
            alert(
              'Error sending transaction. Please check the console for details.',
            );
          }
        } else {
          alert(
            'Metamask not detected. Please install Metamask to use this feature.',
          );
        }
      }
    </script>
  </body>
</html>
